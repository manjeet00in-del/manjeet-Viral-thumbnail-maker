<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manjeet Viral Thumbnail Maker</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#101010;
 color:#fff;
 font-family:Arial,sans-serif
}
header{
 text-align:center;
 padding:18px;
 background:#181818;
 border-bottom:1px solid #333
}
header h1{margin:0;font-size:25px}
header p{margin:6px 0 0;color:#aaa}

.container{
 max-width:1150px;
 margin:auto;
 padding:15px
}

.editor{
 display:grid;
 grid-template-columns:350px 1fr;
 gap:16px
}

.panel{
 background:#1b1b1b;
 border:1px solid #333;
 border-radius:15px;
 padding:16px
}

label{
 display:block;
 font-weight:bold;
 margin:13px 0 6px
}

input,select,textarea{
 width:100%;
 padding:11px;
 border-radius:8px;
 border:1px solid #444;
 background:#0d0d0d;
 color:#fff;
 font-size:15px
}

input[type=color]{
 height:45px;
 padding:3px
}

input[type=range]{padding:0}

textarea{min-height:75px}

button{
 width:100%;
 border:0;
 border-radius:9px;
 padding:12px;
 margin-top:9px;
 font-weight:bold;
 cursor:pointer;
 background:#fff;
 color:#111
}

button.dark{
 background:#333;
 color:#fff
}

.styles{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:7px
}

.styles button{
 margin:0;
 font-size:13px
}

.row{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px
}

.canvas-area{
 display:flex;
 justify-content:center;
 align-items:center;
 min-height:550px;
 background:#070707;
 border-radius:15px;
 padding:15px;
 overflow:hidden
}

canvas{
 max-width:100%;
 max-height:75vh;
 width:auto;
 height:auto;
 display:block;
 box-shadow:0 10px 35px rgba(0,0,0,.7);
 touch-action:none
}

.download{
 margin-top:12px;
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}

.info{
 color:#999;
 font-size:12px;
 line-height:1.5;
 margin-top:12px
}

@media(max-width:850px){
 .editor{grid-template-columns:1fr}
 .canvas-area{min-height:300px}
 canvas{max-height:60vh}
}
</style>
</head>

<body>

<header>
<h1>🔥 Manjeet Viral Thumbnail Maker</h1>
<p>YouTube • Instagram • Facebook</p>
</header>

<div class="container">

<div class="editor">

<!-- CONTROL PANEL -->

<div class="panel">

<label>📐 Platform</label>

<select id="platform">
<option value="youtube">YouTube — 1280 × 720</option>
<option value="instagram">Instagram — 1080 × 1080</option>
<option value="reels">Reels — 1080 × 1920</option>
<option value="facebook">Facebook — 1200 × 630</option>
</select>


<label>🖼️ Upload Photo</label>

<input
id="photo"
type="file"
accept="image/*"
>


<label>🔥 Main Headline</label>

<textarea id="headline">10 करोड़ जीत गया! 😱</textarea>


<label>✍️ Small Text</label>

<input
id="subtext"
value="देखकर आप भी हैरान रह जाएंगे"
>


<label>🎨 Style</label>

<div class="styles">

<button onclick="stylePreset('viral')">
🔥 Viral
</button>

<button onclick="stylePreset('cinematic')">
🎬 Cinematic
</button>

<button onclick="stylePreset('news')">
📰 Breaking
</button>

<button onclick="stylePreset('shock')">
😱 Shocking
</button>

<button onclick="stylePreset('money')">
💰 Money
</button>

<button onclick="stylePreset('trending')">
❤️ Trending
</button>

<button onclick="stylePreset('horror')">
👻 Horror
</button>

<button onclick="stylePreset('gaming')">
🎮 Gaming
</button>

</div>


<label>🔤 Text Size</label>

<input
id="textSize"
type="range"
min="30"
max="150"
value="85"
>


<label>🎨 Text Color</label>

<input
id="textColor"
type="color"
value="#ffe600"
>


<label>⭕ Outline</label>

<input
id="outline"
type="range"
min="0"
max="25"
value="10"
>


<label>🌑 Shadow</label>

<input
id="shadow"
type="range"
min="0"
max="40"
value="18"
>


<label>🔍 Photo Zoom</label>

<input
id="zoom"
type="range"
min="100"
max="200"
value="100"
>


<label>↔️ Photo Horizontal</label>

<input
id="photoX"
type="range"
min="-100"
max="100"
value="0"
>


<label>↕️ Photo Vertical</label>

<input
id="photoY"
type="range"
min="-100"
max="100"
value="0"
>


<div class="row">

<button onclick="resetAll()">
🔄 Reset
</button>

<button class="dark" onclick="draw()">
👁️ Preview
</button>

</div>

<div class="info">

💡 Canvas पर headline को finger/mouse से drag करके उसकी position बदल सकते हैं।

<br><br>

यह पूरा editor browser में चलता है।
Server या Render की जरूरत नहीं।

</div>

</div>


<!-- CANVAS -->

<div class="panel">

<div class="canvas-area">

<canvas id="canvas"></canvas>

</div>

<div class="download">

<button onclick="downloadPNG()">
📥 Download HD
</button>

<button class="dark" onclick="shareImage()">
📱 Share
</button>

</div>

</div>

</div>

</div>


<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

let image=null;

let textX=0.5;

let textY=0.62;

let dragging=false;


/* IMAGE */

document
.getElementById("photo")
.addEventListener(
"change",
function(e){

 const file=e.target.files[0];

 if(!file)return;

 const reader=new FileReader();

 reader.onload=function(event){

  image=new Image();

  image.onload=function(){

   draw();

  };

  image.src=event.target.result;

 };

 reader.readAsDataURL(file);

});


/* LIVE CONTROLS */

[
"platform",
"headline",
"subtext",
"textSize",
"textColor",
"outline",
"shadow",
"zoom",
"photoX",
"photoY"
].forEach(function(id){

 document
 .getElementById(id)
 .addEventListener(
 "input",
 draw
 );

});


/* SIZE */

function getSize(){

 const p=
 document.getElementById(
 "platform"
 ).value;

 if(p==="youtube")
  return [1280,720];

 if(p==="instagram")
  return [1080,1080];

 if(p==="reels")
  return [1080,1920];

 return [1200,630];

}


/* IMAGE */

function drawImage(){

 if(!image){

  ctx.fillStyle="#252525";

  ctx.fillRect(
   0,
   0,
   canvas.width,
   canvas.height
  );

  return;

 }

 const w=canvas.width;
 const h=canvas.height;

 const zoom=
 Number(
 document.getElementById("zoom").value
 )/100;

 const px=
 Number(
 document.getElementById("photoX").value
 );

 const py=
 Number(
 document.getElementById("photoY").value
 );

 const scale=
 Math.max(
  w/image.width,
  h/image.height
 )*zoom;

 const iw=image.width*scale;
 const ih=image.height*scale;

 const x=
 (w-iw)/2
 +
 px*(w/200);

 const y=
 (h-ih)/2
 +
 py*(h/200);

 ctx.drawImage(
  image,
  x,
  y,
  iw,
  ih
 );

}


/* DRAW */

function draw(){

 const [w,h]=getSize();

 canvas.width=w;
 canvas.height=h;

 ctx.clearRect(
  0,
  0,
  w,
  h
 );


 /* PHOTO */

 drawImage();


 /* DARK GRADIENT */

 const gradient=
 ctx.createLinearGradient(
  0,
  0,
  0,
  h
 );

 gradient.addColorStop(
  0,
  "rgba(0,0,0,.08)"
 );

 gradient.addColorStop(
  .55,
  "rgba(0,0,0,.15)"
 );

 gradient.addColorStop(
  1,
  "rgba(0,0,0,.75)"
 );

 ctx.fillStyle=gradient;

 ctx.fillRect(
  0,
  0,
  w,
  h
 );


 /* HEADLINE */

 const text=
 document
 .getElementById("headline")
 .value
 .trim();

 const size=
 Number(
 document
 .getElementById("textSize")
 .value
 );

 ctx.font=
 "900 "+size+"px Arial";

 ctx.textAlign="center";

 ctx.textBaseline="middle";

 ctx.fillStyle=
 document
 .getElementById("textColor")
 .value;

 ctx.strokeStyle="#000";

 ctx.lineWidth=
 Number(
 document
 .getElementById("outline")
 .value
 );

 ctx.shadowColor=
 "rgba(0,0,0,.9)";

 ctx.shadowBlur=
 Number(
 document
 .getElementById("shadow")
 .value
 );


 /* WRAP */

 const words=text.split(/\s+/);

 let lines=[];

 let line="";

 const maxWidth=w*.88;

 words.forEach(function(word){

  const test=
  line
  ?
  line+" "+word
  :
  word;

  if(
   ctx.measureText(test).width
   >
   maxWidth
   &&
   line
  ){

   lines.push(line);

   line=word;

  }else{

   line=test;

  }

 });

 if(line)
  lines.push(line);


 const lineHeight=
 size*1.05;

 const total=
 lines.length*
 lineHeight;

 let centerY=
 textY*h;


 lines.forEach(function(line,index){

  const y=
  centerY
  -
  total/2
  +
  index*lineHeight;

  ctx.strokeText(
   line,
   textX*w,
   y
  );

  ctx.fillText(
   line,
   textX*w,
   y
  );

 });


 ctx.shadowBlur=0;


 /* SUBTEXT */

 const sub=
 document
 .getElementById("subtext")
 .value
 .trim();

 if(sub){

  ctx.font=
  "700 "+
  Math.max(
   24,
   w/38
  )+
  "px Arial";

  ctx.fillStyle="#fff";

  ctx.strokeStyle="#000";

  ctx.lineWidth=5;

  ctx.strokeText(
   sub,
   w/2,
   Math.min(
    h-55,
    centerY+
    total/2+
    45
   )
  );

  ctx.fillText(
   sub,
   w/2,
   Math.min(
    h-55,
    centerY+
    total/2+
    45
   )
  );

 }

}


/* DRAG TEXT */

function pointerPosition(e){

 const rect=
 canvas.getBoundingClientRect();

 const clientX=
 e.touches
 ?
 e.touches[0].clientX
 :
 e.clientX;

 const clientY=
 e.touches
 ?
 e.touches[0].clientY
 :
 e.clientY;

 return {

  x:
  (clientX-rect.left)
  /
  rect.width,

  y:
  (clientY-rect.top)
  /
  rect.height

 };

}


canvas.addEventListener(
"mousedown",
function(e){

 dragging=true;

 moveText(e);

});


canvas.addEventListener(
"mousemove",
function(e){

 if(dragging)
  moveText(e);

});


window.addEventListener(
"mouseup",
function(){

 dragging=false;

});


canvas.addEventListener(
"touchstart",
function(e){

 dragging=true;

 moveText(e);

 e.preventDefault();

},
{passive:false}
);


canvas.addEventListener(
"touchmove",
function(e){

 if(dragging)
  moveText(e);

 e.preventDefault();

},
{passive:false}
);


window.addEventListener(
"touchend",
function(){

 dragging=false;

});


function moveText(e){

 const p=
 pointerPosition(e);

 textX=
 Math.max(
  .05,
  Math.min(
   .95,
   p.x
  )
 );

 textY=
 Math.max(
  .08,
  Math.min(
   .92,
   p.y
  )
 );

 draw();

}


/* STYLE PRESETS */

function stylePreset(style){

 const color=
 document.getElementById(
  "textColor"
 );

 const outline=
 document.getElementById(
  "outline"
 );

 const shadow=
 document.getElementById(
  "shadow"
 );

 if(style==="viral"){

  color.value="#ffe600";
  outline.value=12;
  shadow.value=20;

 }

 if(style==="cinematic"){

  color.value="#ffffff";
  outline.value=7;
  shadow.value=28;

 }

 if(style==="news"){

  color.value="#ffffff";
  outline.value=14;
  shadow.value=15;

 }

 if(style==="shock"){

  color.value="#ff3030";
  outline.value=15;
  shadow.value=30;

 }

 if(style==="money"){

  color.value="#ffd700";
  outline.value=10;
  shadow.value=24;

 }

 if(style==="trending"){

  color.value="#ff4f9a";
  outline.value=9;
  shadow.value=22;

 }

 if(style==="horror"){

  color.value="#ff1f1f";
  outline.value=16;
  shadow.value=35;

 }

 if(style==="gaming"){

  color.value="#00ffcc";
  outline.value=13;
  shadow.value=30;

 }

 draw();

}


/* DOWNLOAD */

function downloadPNG(){

 const link=
 document.createElement("a");

 link.download=
 "manjeet-viral-thumbnail.png";

 link.href=
 canvas.toDataURL(
  "image/png"
 );

 link.click();

}


/* SHARE */

function shareImage(){

 canvas.toBlob(
 async function(blob){

  if(!navigator.share){

   alert(
    "Direct Share उपलब्ध नहीं है। Download करके share करें।"
   );

   return;

  }

  const file=
  new File(
   [blob],
   "thumbnail.png",
   {
    type:"image/png"
   }
  );

  try{

   await navigator.share({

    title:
    "Manjeet Viral Thumbnail",

    files:[file]

   });

  }catch(e){}

 },
 "image/png"
 );

}


/* RESET */

function resetAll(){

 document
 .getElementById("headline")
 .value=
 "10 करोड़ जीत गया! 😱";

 document
 .getElementById("subtext")
 .value=
 "देखकर आप भी हैरान रह जाएंगे";

 document
 .getElementById("textSize")
 .value=85;

 document
 .getElementById("textColor")
 .value="#ffe600";

 document
 .getElementById("outline")
 .value=10;

 document
 .getElementById("shadow")
 .value=18;

 document
 .getElementById("zoom")
 .value=100;

 document
 .getElementById("photoX")
 .value=0;

 document
 .getElementById("photoY")
 .value=0;

 textX=.5;

 textY=.62;

 draw();

}


/* START */

draw();

</script>

</body>
</html>
